<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Content Editor &mdash; theblackbird.ai</title>
<link rel="icon" type="image/png" href="assets/logo-mark.png" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="css/admin.css" />
</head>
<body>

<header class="admin-topbar">
  <div class="admin-topbar-left">
    <a href="index.html" class="admin-back" title="Back to site">
      <svg width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="M13 8H3M7 4 3 8l4 4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </a>
    <img src="assets/logo-mark.png" alt="" class="admin-logo" />
    <div>
      <p class="admin-title">Content Editor</p>
      <p class="admin-subtitle">theblackbird.ai</p>
    </div>
  </div>

  <div class="admin-topbar-actions">
    <span class="admin-status" id="admin-status">All changes saved</span>
    <button id="btn-reset" class="btn-admin btn-admin-ghost">Reset to Defaults</button>
    <label class="btn-admin btn-admin-ghost file-btn">
      Import
      <input type="file" id="import-file" accept=".js,text/javascript" hidden />
    </label>
    <button id="btn-download" class="btn-admin btn-admin-ghost">Download content.js</button>
    <a href="index.html" target="_blank" rel="noopener" class="btn-admin btn-admin-ghost">Open Live Site ↗</a>
    <button id="btn-save" class="btn-admin btn-admin-primary">Save Changes</button>
  </div>
</header>

<div class="admin-layout">
  <nav class="admin-sidebar" id="admin-sidebar" aria-label="Content sections"></nav>

  <main class="admin-form-area" id="admin-form-area"></main>

  <aside class="admin-preview" id="admin-preview">
    <div class="admin-preview-bar">
      <span>Live Preview</span>
      <button id="btn-refresh-preview" type="button" title="Refresh preview">
        <svg width="14" height="14" viewBox="0 0 16 16" fill="none"><path d="M13.5 8a5.5 5.5 0 1 1-1.6-3.9M13.5 2.5v3.6h-3.6" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
    </div>
    <iframe id="preview-frame" src="index.html" title="Live site preview"></iframe>
  </aside>
</div>

<div class="admin-toast" id="admin-toast"></div>

<script src="js/content.js"></script>
<script src="js/content-store.js"></script>
<script src="js/admin.js"></script>
</body>
</html>
